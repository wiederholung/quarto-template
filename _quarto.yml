project:
  type: default
  output-dir: output

link-citations: true
link-external-newwindow: true
format:
  html:
    theme: cosmo
    css: styles/html/research.css
    code-copy: true
    embed-resources: true
    html-math-method: mathjax
  docx:
    # Printable width of the A4 reference documents, in inches.
    page-width: 5.75
    syntax-highlighting: github
    filters:
      - authors-block
      - quarto
      - styles/docx/compat.lua
  pdf:
    pdf-engine: xelatex
    papersize: a4
    pagestyle: plain
    fontsize: 11pt
    fig-pos: H
    colorlinks: true
    linkcolor: black
    citecolor: black
    urlcolor: MidnightBlue
    mainfont: TeX Gyre Termes
    sansfont: TeX Gyre Heros
    monofont: Consolas
    cite-method: citeproc
    template-partials:
      - styles/latex/title.tex
    include-in-header:
      - styles/latex/common.tex
    keep-tex: false

editor: source
