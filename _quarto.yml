project:
  type: default
  output-dir: output

number-sections: true
link-citations: true
csl: styles/csl/ieee.csl
format:
  html:
    toc: true
    link-external-newwindow: true
    code-copy: hover
    embed-resources: false
    html-math-method: mathjax
  docx:
    # Printable width of the A4 reference documents, in inches.
    page-width: 5.75
    template: styles/docx/document.xml
    authors-block:
      docx:
        placement: template
    filters:
      - authors-block
      - quarto
      - path: styles/docx/panel-cells.lua
        at: pre-render
      - styles/docx/compat.lua
  pdf:
    filters:
      - quarto
      - authors-block
    pdf-engine: xelatex
    papersize: a4
    geometry: margin=1in
    colorlinks: false
    # Let the document class control paragraph indentation and spacing.
    indent: true
