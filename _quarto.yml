project:
  type: default
  output-dir: output

link-citations: true
format:
  html:
    theme: cosmo
    link-external-newwindow: true
    code-copy: true
    embed-resources: true
    html-math-method: mathjax
  docx:
    # Printable width of the A4 reference documents, in inches.
    page-width: 5.75
    # syntax-highlighting: github
    filters:
      - authors-block
      - quarto
      - styles/docx/compat.lua
  pdf:
    filters:
      - quarto
      - authors-block
    pdf-engine: xelatex
    papersize: a4
    # Let the document class control paragraph indentation and spacing.
    indent: true
    colorlinks: false
