name: Check Zotero CSL styles
on:
  schedule:
    - cron: '17 2 1 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-zotero-csl
  cancel-in-progress: false

jobs:
  update:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2
        with:
          version: '1.11.9'
      - name: Compare and validate CSL snapshots
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/update-csl.py --apply | tee "$RUNNER_TEMP/csl-report.md"
          cat "$RUNNER_TEMP/csl-report.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Open or refresh the update PR
        uses: peter-evans/create-pull-request@271a8d0340265f705b14b6d32b9829c1cb33d45e # v7.0.8
        with:
          branch: codex/update-zotero-csl
          delete-branch: true
          title: 更新 Zotero 引用样式
          commit-message: 更新 Zotero 引用样式与快照校验值
          body-path: ${{ runner.temp }}/csl-report.md
          add-paths: |
            styles/csl/*.csl
            styles/manifest.json
